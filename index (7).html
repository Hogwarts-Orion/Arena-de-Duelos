<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Álbum Digital Hogwarts Orión</title>
    <style>
        body { background-color: #1e122b; margin: 0; padding: 20px; font-family: 'Segoe UI', Roboto, sans-serif; display: flex; flex-direction: column; align-items: center; }
        .container { width: 100%; max-width: 650px; background-color: #f3ebf7; border: 4px solid #4a154b; border-radius: 16px; overflow: hidden; box-shadow: 0 12px 24px rgba(0,0,0,0.5); box-sizing: border-box; }
        .admin-panel { background: #222; color: #fff; padding: 20px; border-radius: 10px; border: 2px solid #ffcc00; margin-top: 20px; width: 100%; max-width: 650px; }
        .btn-admin { background: #4a154b; color: white; border: 1px solid #ffcc00; padding: 10px; border-radius: 5px; cursor: pointer; width: 100%; margin-top: 5px; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <div style="background: linear-gradient(135deg, #4a154b, #2c0c2e); padding: 20px; color: white; text-align: center; border-bottom: 4px solid #ffcc00;">
        <span style="font-size: 10px; font-weight: bold; letter-spacing: 4px; color: #ffcc00;">COLECCIÓN VIRTUAL INTERACTIVA</span>
    </div>
    </div>

<div class="admin-panel">
    <h3 style="color:#ffcc00; text-align:center;">🛠 PANEL DE DIRECTOR</h3>
    <div style="text-align:center; margin-bottom:10px;">
        🟢 Alumnos Conectados: <span id="contador-online">0</span>
    </div>
    <input type="password" id="admin-pass" placeholder="Clave de Director..." style="width:100%; padding:8px; box-sizing:border-box;">
    
    <div id="admin-actions" style="display:none; margin-top:10px;">
        <button class="btn-admin" onclick="exportarCSV()">📥 Descargar Reporte CSV</button>
        <button class="btn-admin" onclick="trasladarAAzkaban()" style="background:#8a6893;">🔒 Trasladar a Azkaban</button>
        <button class="btn-admin" onclick="activarLluviaSobres()" style="background:#27ae60;">⚡ Lluvia de Sobres</button>
    </div>
</div>

<script>
    const ADMIN_PASS = "TU_CONTRASEÑA"; // <--- CAMBIA ESTO
    
    // 1. Contador de Conectados
    firebase.database().ref('conectados').on('value', (s) => {
        document.getElementById('contador-online').innerText = s.numChildren();
    });

    // 2. Funciones de Seguridad
    function verificarAcceso() {
        if(document.getElementById('admin-pass').value === ADMIN_PASS) {
            document.getElementById('admin-actions').style.display = 'block';
            return true;
        }
        alert("Contraseña incorrecta");
        return false;
    }

    // 3. Traslado a Azkaban
    function trasladarAAzkaban() {
        if(!verificarAcceso()) return;
        const uid = prompt("UID del alumno:");
        if(uid) firebase.database().ref('usuarios/'+uid+'/cromos').set({"999": true});
    }// 4. Exportar reporte CSV
    function exportarCSV() {
        if(!verificarAcceso()) return;
        firebase.database().ref('usuarios').once('value').then(s => {
            let csv = "Nombre,Cromos\n";
            s.forEach(u => {
                const data = u.val();
                const listaCromos = data.cromos ? Object.keys(data.cromos).join(";") : "";
                csv += `${data.nombre || 'Desconocido'},"${listaCromos}"\n`;
            });
            const blob = new Blob([csv], {type: 'text/csv'});
            const link = document.createElement("a");
            link.href = URL.createObjectURL(blob);
            link.download = "Reporte_Hogwarts.csv";
            link.click();
        });
    }

    // 5. Lluvia de Sobres
    function activarLluviaSobres() {
        if(!verificarAcceso()) return;
        firebase.database().ref('eventos/lluviaSobres').set(Date.now());
        alert("¡Lluvia de sobres activada para todos!");
    }

    // 6. FILTRO DE SOBRES (Anti-Especiales)
    // Esto asegura que en los sobres normales solo salgan IDs <= 126
    const _originalRandom = Math.random;

        return idsValidos[Math.floor(_originalRandom() * idsValidos.length)];
    }
    
    console.log("Sistema de Gestión Hogwarts Orión: Panel, Azkaban y Filtros activos.");
</script>
</body>
</html>
