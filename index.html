<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Álbum Digital Hogwarts Orión</title>
    <style>
        /* Estilos optimizados y centralizados */
        body{background-color:#1e122b;margin:0;padding:20px;font-family:'Segoe UI',sans-serif;display:flex;flex-direction:column;align-items:center;}
        .container{width:100%;max-width:650px;background:#f3ebf7;border:4px solid #4a154b;border-radius:16px;overflow:hidden;box-shadow:0 12px 24px rgba(0,0,0,0.5);}
        .admin-panel{background:#222;border:3px solid #ff3333;border-radius:12px;padding:15px;color:white;margin-top:30px;width:100%;max-width:650px;}
        .btn-admin{background:#4a154b;color:white;border:1px solid #ffcc00;padding:8px;border-radius:4px;cursor:pointer;font-size:11px;font-weight:bold;width:100%;}
    </style>
</head>
<body>

<div class="container">
    <div id="panel-director-root" style="padding:10px; background:#000; color:#fff; text-align:center;">
        🟢 Alumnos Conectados: <span id="contador-online">0</span>
    </div>
    </div>

<div class="admin-panel" id="admin-controls">
    <h3 style="color:#ff3333;">🛠 PANEL MAESTRO</h3>
    <input type="password" id="admin-pass" placeholder="Clave de Director..." style="width:100%; padding:5px; margin-bottom:10px;">
    
    <div id="admin-actions" style="display:none;">
        <button class="btn-admin" onclick="exportarCSV()">📥 Descargar Reporte (CSV)</button>
        <button class="btn-admin" onclick="trasladarAAzkaban()" style="background:#8a6893; margin-top:5px;">🔒 Trasladar a Azkaban</button>
        <button class="btn-admin" onclick="activarLluviaSobres()" style="background:#27ae60; margin-top:5px;">⚡ Lluvia de Sobres</button>
    </div>
</div>

<script>
    // --- LÓGICA OPTIMIZADA ---
    const ADMIN_PASS = "TU_CONTRASEÑA"; 
    
    // 1. Monitorización de Conectados (Integrada con Firebase)
    function iniciarMonitoreo() {
        firebase.database().ref('conectados').on('value', (s) => {
            document.getElementById('contador-online').innerText = s.numChildren();
        });
    }

    // 2. Seguridad
    function verificarAcceso() {
        const pass = document.getElementById('admin-pass').value;
        if(pass === ADMIN_PASS) {
            document.getElementById('admin-actions').style.display = 'block';
        } else {
            alert("Acceso denegado");
        }
    }

    // 3. Azkaban (Limpia inventario, asigna cromo 999)
    function trasladarAAzkaban() {
        const uid = prompt("UID del alumno:");
        if(uid) firebase.database().ref('usuarios/'+uid+'/cromos').set({"999": true});
    }

    // 4. Reporte CSV
    function exportarCSV() {
        firebase.database().ref('usuarios').once('value').then(s => {
            let csv = "Nombre,Cromos\n";
            s.forEach(u => csv += `${u.val().nombre},"${Object.keys(u.val().cromos||{}).join(";")}"\n`);
            const blob = new Blob([csv], {type: 'text/csv'});
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement("a");
            a.href = url; a.download = "reporte.csv"; a.click();
        });
    }

    // Inicialización
    iniciarMonitoreo();
</script>
</body>
</html>
