<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hogwarts Orión - Álbum Digital 2026</title>
    <!-- Librerías Externas -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Special+Elite&family=MedievalSharp&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --gold: #ffcc00;
            --purple-dark: #2c0c2e;
            --purple-light: #4a154b;
            --parchment: #f3ebf7;
            --gryffindor: #7f0909;
            --slytherin: #0d6217;
            --hufflepuff: #ffcc00;
            --ravenclaw: #003366;
            --azkaban: #1a1a1a;
        }

        body {
            background-color: #120816;
            color: #333;
            font-family: 'Segoe UI', sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
        }

        /* Contenedor Principal Estilo Pergamino */
        .main-container {
            width: 100%;
            max-width: 800px;
            background: var(--parchment);
            border: 8px double var(--purple-dark);
            box-shadow: 0 0 50px rgba(0,0,0,0.8);
            min-height: 100vh;
            position: relative;
        }

        /* Cabecera Mágica */
        header {
            background: linear-gradient(135deg, var(--purple-dark), #000);
            padding: 30px 20px;
            text-align: center;
            color: var(--gold);
            border-bottom: 5px solid var(--gold);
        }

        header h1 { font-family: 'Cinzel', serif; margin: 0; font-size: 2.2rem; text-shadow: 0 0 10px var(--gold); }
        
        .director-msg {
            background: rgba(255,204,0,0.1);
            border: 1px dashed var(--gold);
            padding: 10px;
            margin-top: 15px;
            font-family: 'Special Elite', cursive;
            font-size: 0.9rem;
            display: none;
        }

        /* Dashboard del Usuario */
        .user-panel {
            background: white;
            padding: 20px;
            border-bottom: 2px solid #ddd;
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            justify-content: center;
        }

        .stat-box {
            background: #eee;
            padding: 10px 20px;
            border-radius: 8px;
            text-align: center;
            border: 1px solid #ccc;
        }

        /* Grid de Cromos */
        .album-section {
            padding: 20px;
            border-bottom: 2px solid var(--purple-dark);
        }

        .section-title {
            font-family: 'MedievalSharp', cursive;
            background: var(--purple-light);
            color: white;
            padding: 10px;
            text-align: center;
            margin-bottom: 20px;
            clip-path: polygon(5% 0, 95% 0, 100% 50%, 95% 100%, 5% 100%, 0 50%);
        }

        .stickers-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
            gap: 15px;
            justify-items: center;
        }

        /* Carta de Cromo */
        .card {
            width: 130px;
            height: 190px;
            background: #fff;
            border: 2px dashed #aaa;
            border-radius: 8px;
            position: relative;
            transition: 0.3s;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 5px;
            box-sizing: border-box;
        }

        .card.locked { opacity: 0.6; filter: grayscale(1); }
        .card.unlocked { border: 2px solid var(--gold); box-shadow: 0 0 10px rgba(255,204,0,0.4); filter: none; opacity: 1; }

        .card-img {
            width: 100%;
            height: 110px;
            background: #ddd;
            border-radius: 4px;
            margin-bottom: 5px;
            object-fit: cover;
        }

        .card-id { position: absolute; top: -5px; right: -5px; background: var(--purple-dark); color: white; font-size: 10px; padding: 2px 6px; border-radius: 10px; }
        .card-name { font-size: 10px; font-weight: bold; text-align: center; line-height: 1.1; height: 25px; }
        
        .btn-story {
            font-size: 9px;
            background: none;
            border: 1px solid var(--purple-light);
            cursor: pointer;
            border-radius: 4px;
            margin-top: auto;
        }

        /* Panel de Control Director */
        .admin-panel {
            background: #222;
            color: #ff3333;
            padding: 20px;
            width: 100%;
            max-width: 800px;
            margin-top: 50px;
            border: 4px solid #ff3333;
            box-sizing: border-box;
        }

        /* Mercado Flú */
        #mercado-flu {
            background: #fff;
            border: 2px solid var(--ravenclaw);
            margin: 15px;
            padding: 10px;
            border-radius: 8px;
        }

        .trade-msg { border-bottom: 1px solid #eee; padding: 5px; font-size: 11px; }

        /* Estilo Azkaban */
        .section-azkaban { background: var(--azkaban); color: #ff3333; }
        .card-azkaban { border: 2px solid #444; background: #222; }

        @media (max-width: 600px) {
            .stickers-grid { grid-template-columns: repeat(2, 1fr); }
            .card { width: 140px; }
        }
    </style>
</head>
<body>

<div class="main-container">
    <header>
        <h1>HOGWARTS ORIÓN</h1>
        <div id="marauder-count" style="font-size: 12px; color: var(--gold); margin-top: 5px;">👣 Huellas en el mapa: 0 magos activos</div>
        <div id="director-msg" class="director-msg"></div>
    </header>

    <!-- Login/User Dashboard -->
    <section id="auth-zone" style="padding: 30px; text-align: center; background: #fff;">
        <h3>Bienvenido, Joven Mago</h3>
        <input type="text" id="username" placeholder="Nombre de tu personaje..." style="padding: 10px; width: 60%;">
        <button onclick="login()" style="padding: 10px 20px; background: var(--purple-dark); color: white; border: none; cursor: pointer;">Entrar al Colegio</button>
    </section>

    <section id="user-dashboard" style="display: none;">
        <div class="user-panel">
            <div class="stat-box">🧙‍♂️ <br><b id="display-name">-</b></div>
            <div class="stat-box">✨ Esencias<br><b id="display-esencias">0</b></div>
            <div class="stat-box">📜 Progreso<br><b id="display-progreso">0/126</b></div>
            <button onclick="logout()" style="background: none; border: none; color: red; text-decoration: underline; cursor: pointer;">Salir</button>
        </div>

        <!-- Acciones: Sobres y Canjes -->
        <div style="padding: 20px; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; background: #f9f9f9;">
            <div style="border: 1px solid #ccc; padding: 10px; border-radius: 8px;">
                <label style="font-size: 10px; font-weight: bold;">CANJEAR CÓDIGO INDIVIDUAL</label>
                <input type="text" id="cod-individual" placeholder="Código..." style="width: 100%; margin: 5px 0;">
                <button onclick="canjearIndividual()" style="width: 100%; background: var(--purple-light); color: white; border: none; padding: 5px;">Canjear Figurita</button>
            </div>
            <div style="border: 1px solid #ccc; padding: 10px; border-radius: 8px; background: #fff8e7;">
                <label style="font-size: 10px; font-weight: bold;">ABRIR SOBRE (3 CROMOS)</label>
                <input type="text" id="cod-sobre" placeholder="ORION-SOBRE-..." style="width: 100%; margin: 5px 0;">
                <button onclick="abrirSobre()" style="width: 100%; background: #e67e22; color: white; border: none; padding: 5px;">Abrir Paquete ✨</button>
            </div>
        </div>

        <!-- Mercado Flú -->
        <div id="mercado-flu">
            <h4 style="margin: 0 0 10px 0; font-family: 'MedievalSharp';">📜 Tablón de Anuncios (Mercado Flú)</h4>
            <div style="display: flex; gap: 5px; margin-bottom: 10px;">
                <input type="text" id="trade-input" placeholder="Cambio cromo 10 por 50..." style="flex: 1; font-size: 12px;">
                <button onclick="postTrade()" style="background: var(--ravenclaw); color: white; border: none; padding: 5px 10px;">Publicar</button>
            </div>
            <div id="trade-board" style="max-height: 100px; overflow-y: auto;"></div>
        </div>
    </section>

    <!-- ÁLBUM POR SECCIONES -->
    <div id="album-content">
        <!-- Generado dinámicamente -->
    </div>
</div>

<!-- PANEL DEL DIRECTOR -->
<div class="admin-panel">
    <h2 style="font-family: 'Cinzel';">PANEL DEL DIRECTOR</h2>
    <div id="admin-auth">
        <input type="password" id="admin-pass" placeholder="Clave secreta...">
        <button onclick="checkAdmin()">Acceder</button>
    </div>

    <div id="admin-tools" style="display: none; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 20px;">
        <div>
            <h4>📣 COMUNICADO</h4>
            <input type="text" id="msg-director-input" placeholder="Mensaje para todos..." style="width: 100%;">
            <button onclick="setDirectorMsg()" style="width: 100%; margin-top: 5px;">Enviar</button>
            <hr>
            <h4>🎰 SORTEO FLASH</h4>
            <button onclick="runLottery()" style="width: 100%; background: gold; color: black; font-weight: bold; padding: 10px;">SORTEAR ENTRE CONECTADOS</button>
        </div>
        <div>
            <h4>📊 DATOS</h4>
            <button onclick="exportExcel()" style="width: 100%; background: green; color: white; padding: 10px;">DESCARGAR EXCEL DE ALUMNOS</button>
            <hr>
            <h4>➕ INYECTAR CROMO</h4>
            <input type="text" id="new-name" placeholder="Nombre..." style="width:100%;">
            <input type="text" id="new-url" placeholder="URL Imagen..." style="width:100%;">
            <select id="new-sec" style="width:100%; margin-top:5px;">
                <option value="especiales">General</option>
                <option value="gryffindor">Gryffindor 🦁</option>
                <option value="slytherin">Slytherin 🐍</option>
                <option value="azkaban">Azkaban ⛓️</option>
            </select>
            <button onclick="saveCromo()" style="width:100%; margin-top:5px;">Crear Cromo Permanente</button>
        </div>
    </div>
</div>

<script>
    // --- CONFIGURACIÓN ---
    const FB_URL = "https://album-75178-default-rtdb.firebaseio.com/"; // TU URL
    let currentUser = localStorage.getItem('orion_user') || null;
    let userStats = { pegados: new Set(), esencias: 0 };
    let cromoDB = {
        // Base 1-126 cargada por defecto para evitar huecos
    };

    // Inicializar IDs 1-126
    for(let i=1; i<=126; i++) {
        cromoDB[i] = { nombre: "Mago Desconocido #" + i, seccion: i <= 101 ? "especiales" : "criaturas", url: "" };
    }
    // Prisioneros base
    const prisionerosBase = {
        "666": "Cris DelaCour (Slytherin)",
        "667": "Fernando Greengrass (Slytherin)",
        "668": "Ana Black (Gryffindor)",
        "669": "Gabo Sayre (Gryffindor)",
        "670": "Odette Salvatore (Slytherin)"
    };
    Object.keys(prisionerosBase).forEach(id => {
        cromoDB[id] = { nombre: prisionerosBase[id], seccion: "azkaban", url: "" };
    });

    // --- LÓGICA DE INICIO ---
    window.onload = async () => {
        await syncCromoDB();
        renderAlbum();
        if(currentUser) login(currentUser);
        startMarauderMap();
        listenMessages();
        loadTrades();
    };

    async function syncCromoDB() {
        const res = await fetch(FB_URL + "cromos_extra.json");
        const extra = await res.json();
        if(extra) Object.assign(cromoDB, extra);
    }

    function renderAlbum() {
        const content = document.getElementById('album-content');
        content.innerHTML = "";
        
        const secciones = [
            { id: 'especiales', nombre: '⭐ CROMOS HISTÓRICOS' },
            { id: 'gryffindor', nombre: '🦁 CASA GRYFFINDOR' },
            { id: 'slytherin', nombre: '🐍 CASA SLYTHERIN' },
            { id: 'azkaban', nombre: '⛓️ PRISIONEROS DE AZKABAN' }
        ];

        secciones.forEach(sec => {
            const div = document.createElement('div');
            div.className = `album-section ${sec.id === 'azkaban' ? 'section-azkaban' : ''}`;
            div.innerHTML = `<div class="section-title">${sec.nombre}</div><div class="stickers-grid" id="grid-${sec.id}"></div>`;
            content.appendChild(div);
        });

        Object.keys(cromoDB).forEach(id => {
            const c = cromoDB[id];
            const grid = document.getElementById('grid-' + (c.seccion || 'especiales'));
            if(grid) grid.innerHTML += createCardHTML(id, c);
        });
    }

    function createCardHTML(id, data) {
        return `
            <div class="card locked" id="card-${id}">
                <div class="card-id">N° ${id}</div>
                <img src="${data.url || 'https://via.placeholder.com/130x110?text=?'}" class="card-img" id="img-${id}">
                <div class="card-name">${data.nombre}</div>
                <button class="btn-story" onclick="showStory('${id}')">Ver Historia</button>
            </div>
        `;
    }

    // --- LÓGICA DE USUARIO ---
    async function login(storedUser = null) {
        const user = storedUser || document.getElementById('username').value.trim();
        if(!user) return;
        
        currentUser = user.replace(/[\.\#\$\[\]]/g, "_");
        localStorage.setItem('orion_user', currentUser);
        
        document.getElementById('auth-zone').style.display = 'none';
        document.getElementById('user-dashboard').style.display = 'block';
        document.getElementById('display-name').innerText = currentUser;

        // Registrar en Mapa del Merodeador
        fetch(FB_URL + `activos/${currentUser}.json`, { method: 'PUT', body: JSON.stringify(Date.now()) });

        // Cargar Progreso
        const res = await fetch(FB_URL + `usuarios/${currentUser}.json`);
        const data = await res.json();
        if(data) {
            Object.keys(data).forEach(id => { if(data[id] === true) unlockCard(id); });
        }
        updateStats();
    }

    function unlockCard(id) {
        userStats.pegados.add(id);
        const el = document.getElementById('card-' + id);
        if(el) el.classList.remove('locked'), el.classList.add('unlocked');
    }

    function updateStats() {
        document.getElementById('display-progreso').innerText = `${userStats.pegados.size} / 126`;
    }

    // --- SOBRES Y CANJES ---
    async function abrirSobre() {
        const cod = document.getElementById('cod-sobre').value.trim().toUpperCase();
        const res = await fetch(FB_URL + `sobres/${cod}.json`);
        const sobre = await res.json();

        if(!sobre || sobre.usado) return alert("Código inválido o ya usado.");

        // Marcar como usado
        await fetch(FB_URL + `sobres/${cod}/usado.json`, { method: 'PUT', body: 'true' });

        let obtenidos = [];
        // Lógica de sorteo (1-126)
        for(let i=0; i<3; i++) {
            let id;
            if(Math.random() < 0.01) { // 1% Azkaban o Alumno
                const especiales = Object.keys(cromoDB).filter(x => parseInt(x) > 126);
                id = especiales[Math.floor(Math.random() * especiales.length)];
            } else {
                id = Math.floor(Math.random() * 126) + 1;
            }
            obtenidos.push(id);
            await fetch(FB_URL + `usuarios/${currentUser}/${id}.json`, { method: 'PUT', body: 'true' });
            unlockCard(id);
        }
        alert("🎉 ¡Sobre Abierto! Has obtenido los cromos: " + obtenidos.join(", "));
        updateStats();
    }

    // --- MANTENIMIENTO DEL MAPA ---
    function startMarauderMap() {
        setInterval(async () => {
            const res = await fetch(FB_URL + "activos.json");
            const data = await res.json();
            const count = data ? Object.keys(data).length : 0;
            document.getElementById('marauder-count').innerText = `👣 Huellas en el mapa: ${count} magos activos`;
        }, 10000);
    }

    function listenMessages() {
        setInterval(async () => {
            const res = await fetch(FB_URL + "mensaje_director.json");
            const msg = await res.json();
            if(msg) {
                const box = document.getElementById('director-msg');
                box.style.display = 'block';
                box.innerText = "📢 " + msg;
            }
        }, 5000);
    }

    // --- ADMIN TOOLS ---
    function checkAdmin() {
        if(document.getElementById('admin-pass').value === "orion2026") {
            document.getElementById('admin-tools').style.display = 'grid';
            document.getElementById('admin-auth').style.display = 'none';
        }
    }

    async function exportExcel() {
        const res = await fetch(FB_URL + "usuarios.json");
        const users = await res.json();
        let rows = [];
        Object.keys(users).forEach(u => {
            let count = Object.keys(users[u]).filter(k => users[u][k] === true).length;
            rows.push({ Mago: u, Cantidad: count });
        });
        const ws = XLSX.utils.json_to_sheet(rows);
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, "Alumnos");
        XLSX.writeFile(wb, "Hogwarts_Orion_Reporte.xlsx");
    }

    async function saveCromo() {
        const name = document.getElementById('new-name').value;
        const url = document.getElementById('new-url').value;
        const sec = document.getElementById('new-sec').value;
        const id = sec === "azkaban" ? Date.now().toString().slice(-3) : Math.floor(Math.random() * 500) + 200;
        
        await fetch(FB_URL + `cromos_extra/${id}.json`, {
            method: 'PUT',
            body: JSON.stringify({ nombre: name, url: url, seccion: sec })
        });
        alert("Cromo inyectado con éxito!");
        location.reload();
    }

    function showStory(id) {
        alert(`📜 HISTORIA DEL CROMO #${id}\n\nEste personaje es parte fundamental de la historia de Hogwarts Orión. [Escribe aquí tu lore personalizado para este ID]`);
    }

    function logout() { localStorage.removeItem('orion_user'); location.reload(); }
</script>

</body>
</html>
